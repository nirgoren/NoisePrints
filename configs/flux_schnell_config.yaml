# Seed Watermark Robustness Tests Configuration

# General Configuration
model_type: "flux"  # "flux" or "sdxl"
model_id: "black-forest-labs/FLUX.1-schnell"
image_generation_count: 100
output_dir: "out/robustness_tests/FLUX_schnell/generated_images"
latent_dir: "out/robustness_tests/FLUX_schnell/generated_latents"
results_file: "out/robustness_tests/FLUX_schnell/results.csv"

# Image Generation Parameters
image_width: 1024
image_height: 1024
num_inference_steps: 4  # FLUX Schnell is optimized for 1-4 steps
guidance_scale: 0.0      # FLUX Schnell typically uses guidance_scale=0

# Base Corruption Parameterization
base_corruptions:
  jpeg_corruption:
    quality: [10, 15, 25]
  gaussian_blur:
    radius: [2, 4, 6]
  gaussian_noise:
    std: [0.1, 0.2, 0.3]
  brightness_change:
    factor: [2.0, 3.0, 4.0]
  contrast_change:
    factor: [2.0, 3.0, 4.0]
  resize:
    scale: [0.20, 0.25, 0.3]

# SDEdit Corruption Settings (optional)
sdedit_corruptions:
  enabled: true  # Set to true to enable SDEdit corruptions
  noise_strengths: [0.2, 0.3, 0.4]  # List of noise strengths to test
  attack_models: ["cross"]  # Types of attacks: same model or cross-model
  cross_model_config: "configs/sdxl_config.yaml"  # Config for cross-model attacks

# Inversion-Attack Corruption Settings (optional)
inversion_corruptions:
  enabled: true
  attack_models: ["cross"]
  cross_model_config: "configs/sdxl_config.yaml"
  similarity_weights: [0.3, 0.4, 0.5]
  fidelity_weight: 1.0
  inversion_steps: 50
  inversion_guidance: 1.0
  optimization_steps: 100
  learning_rate: 0.01